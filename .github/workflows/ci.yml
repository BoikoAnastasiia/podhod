name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # apps/api has a pretest hook that builds @podhod/web first, which the
      # API tests need: the Worker's assets binding reads apps/web/dist at
      # test-collection time.
      - run: pnpm test

      - run: pnpm --filter @podhod/web exec playwright install --with-deps chromium

      - run: pnpm --filter @podhod/api run db:migrate:local
      - run: pnpm --filter @podhod/api run seed:local

      # wrangler dev reads apps/api/.dev.vars, which is git-ignored because it
      # holds real credentials on a developer's machine. CI has none and needs
      # none: the Google tests assert that an authorisation URL is *built*
      # correctly and abort the request before it leaves the browser, so any
      # non-empty client id exercises the same code path. Without a value
      # Better Auth cannot construct the URL at all, and those tests fail with
      # no redirect rather than a wrong one. These are placeholders, not
      # secrets — they authenticate nothing and are useless off this runner.
      - name: Write placeholder auth credentials for the dev Worker
        run: |
          cat > apps/api/.dev.vars <<'VARS'
          BETTER_AUTH_SECRET=ci-placeholder-secret-not-used-for-anything-real
          GOOGLE_CLIENT_ID=ci-placeholder.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=ci-placeholder-google-secret
          VARS

      # The Worker is not started here any more. This step's own comment used
      # to claim "Playwright's own webServer only starts Vite" — it did not; it
      # ran `pnpm dev`, which starts both. So CI ran two Workers: the one begun
      # here on :8787, and a second one Playwright spawned, which does not fail
      # on a taken port but quietly binds another (observed: 8789). Both used
      # the same local D1 SQLite file, and two processes writing one database is
      # what made sign-up intermittently blow a five-second timeout.
      #
      # playwright.config.ts now declares both servers, so it starts exactly one
      # of each and waits for both to answer.
      - run: pnpm --filter @podhod/web exec playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @podhod/web run build

      # `wrangler deploy` ships the Worker, never the database schema — the two
      # are deployed separately. Without this step the auth migration stayed
      # local: production ran code that queried `user` and `session` against a
      # database holding only the exercise tables, so every sign-in and sign-up
      # returned 500 while the library kept working. Applying before the deploy
      # keeps the schema from ever being behind the code that expects it, and
      # the command is idempotent — it records what it has run in the
      # d1_migrations table and skips those next time.
      - run: pnpm --filter @podhod/api run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: pnpm --filter @podhod/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
